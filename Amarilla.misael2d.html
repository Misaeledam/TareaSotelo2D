<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto 3D en Realidad Aumentada · Misael Amarilla</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header { padding: 18px 20px 8px; text-align: center; }
    header h1 { font-size: 1.5rem; }
    header p { color: #94a3b8; font-size: .92rem; margin-top: 4px; }
    model-viewer {
      flex: 1;
      width: 100%;
      min-height: 70vh;
      background: radial-gradient(circle at 50% 40%, #1e293b, #0f172a 70%);
      --poster-color: transparent;
    }
    .btn-ar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #f97316;
      color: #fff;
      border: none;
      border-radius: 30px;
      padding: 14px 26px;
      font-size: 1rem;
      font-weight: 600;
      box-shadow: 0 6px 18px rgba(0,0,0,.35);
      cursor: pointer;
    }
    .sin-ar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15,23,42,.85);
      padding: 10px 16px;
      border-radius: 10px;
      font-size: .85rem;
      color: #cbd5e1;
      text-align: center;
      width: max-content;
      max-width: 90%;
    }
    footer { text-align: center; color: #64748b; font-size: .78rem; padding: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>🚗 Auto 3D en Realidad Aumentada</h1>
    <p>Girá el modelo con el dedo, hacé zoom con dos dedos y tocá «Ver en AR» para ubicarlo en tu espacio.</p>
  </header>

  <model-viewer
    src="auto.glb"
    alt="Modelo 3D de un auto de juguete"
    camera-controls
    touch-action="pan-y"
    auto-rotate
    auto-rotate-delay="0"
    rotation-per-second="30deg"
    shadow-intensity="1"
    exposure="1"
    environment-image="neutral"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="auto"
    ar-placement="floor">
    <button slot="ar-button" class="btn-ar">📱 Ver en AR</button>
    <div slot="ar-failure" class="sin-ar">Este dispositivo no admite Realidad Aumentada.</div>
  </model-viewer>

  <footer>Actividad Práctica WebAR · Misael Amarilla · Modelo «Toy Car» (Khronos glTF Sample Assets, CC0)</footer>
</body>
</html>
